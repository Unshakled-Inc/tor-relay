services:
  tor-relay:
    # Published image: docker.io/unshakled/tor-relay:latest
    image: tor-relay:dev
    # Host networking lets tor and lyrebird bind their ports directly.
    # Both ORPort and the obfs4 port must be reachable from the internet.
    network_mode: host
    env_file:
      - .env.example
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 45s
    volumes:
      - tor-data:/var/lib/tor

volumes:
  tor-data:
