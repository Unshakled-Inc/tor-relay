services:
  tor-relay:
    # Published image: docker.io/unshakled/tor-relay:latest
    image: tor-relay:dev
    env_file:
      - .env.example
    # The reverse proxy on the host connects to 127.0.0.1:15000.
    # Tor binds ORPort on 127.0.0.1:auto inside the container, so no
    # ORPort mapping is needed.
    ports:
      - "127.0.0.1:15000:15000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    pids_limit: 512
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - tor-data:/var/lib/tor

volumes:
  tor-data:
