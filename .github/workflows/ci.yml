name: ci

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi
      - name: em dash
        run: |
          if grep -rnI --exclude-dir=.git $'\xe2\x80\x94' .; then
            echo "EM DASH FOUND"
            exit 1
          fi
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build runtime image
        run: |
          docker buildx build \
            --target runtime \
            --build-arg "TOR_VERSION=$(cat VERSION)" \
            --build-arg "TORINIT_VERSION=$(cat VERSION)" \
            --build-arg "REVISION=${{ github.sha }}" \
            --build-arg "LYREBIRD_VERSION=$(cat LYREBIRD_VERSION)" \
            --build-arg "LYREBIRD_COMMIT=$(cat LYREBIRD_COMMIT)" \
            --build-arg "WEBTUNNEL_VERSION=$(cat WEBTUNNEL_VERSION)" \
            --build-arg "WEBTUNNEL_COMMIT=$(cat WEBTUNNEL_COMMIT)" \
            --platform linux/amd64 \
            -t tor-relay:ci \
            --load .
      - name: render and verify every example
        run: |
          for envfile in examples/*/.env.example; do
            if [ ! -e "$envfile" ]; then
              continue
            fi
            echo "== $envfile"
            docker run --rm --env-file "$envfile" tor-relay:ci render > /dev/null
            docker run --rm --env-file "$envfile" tor-relay:ci verify
          done
