name: daily-scan

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: write
  issues: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - name: scan published latest with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: docker.io/unshakled/tor-relay:latest
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
          version: v0.70.0
      - name: trigger weekly rebuild
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run weekly.yml --ref main
      - name: open an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(gh issue list --state open \
            --search 'Daily vulnerability scan failed in:title' \
            --json number --jq '.[0].number')"
          if [ -z "$existing" ]; then
            gh issue create \
              --title "Daily vulnerability scan failed" \
              --body "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
