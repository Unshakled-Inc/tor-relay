name: watch

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      version: ${{ steps.compare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: compare dist.torproject.org with VERSION
        id: compare
        run: |
          latest="$(scripts/latest-tor-version.sh)"
          current="$(cat VERSION)"
          if [ "$latest" != "$current" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$latest" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "version=$current" >> "$GITHUB_OUTPUT"
          fi

  bump:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: update VERSION
        run: |
          printf '%s\n' "${{ needs.check.outputs.version }}" > VERSION
      - name: commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "build: tor ${{ needs.check.outputs.version }}"
          git push origin HEAD:main

  release:
    needs: [check, bump]
    if: needs.check.outputs.changed == 'true'
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/build.yml
    with:
      tor_version: ${{ needs.check.outputs.version }}
      push: true
      no_cache: false
    secrets: inherit

  heartbeat:
    needs: [check, bump, release]
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    steps:
      - name: ping heartbeat
        env:
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
        run: |
          if [ -n "$HEARTBEAT_URL" ]; then
            curl -fsS --retry 3 "$HEARTBEAT_URL"
          else
            echo "HEARTBEAT_URL is not set, skipping"
          fi

  notify:
    needs: [check, bump, release]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: open an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(gh issue list --state open \
            --search 'Scheduled watch failed in:title' \
            --json number --jq '.[0].number')"
          if [ -z "$existing" ]; then
            gh issue create \
              --title "Scheduled watch failed" \
              --body "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

  transports:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: compare transport tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          check() {
            repo="$1"
            file="$2"
            current="$(cat "$file")"
            latest="$(git ls-remote --tags --refs --sort=-v:refname "$repo" | awk -F/ '{print $NF}' | head -1)"
            if [ -z "$latest" ]; then
              echo "could not read tags for $repo" >&2
              return 0
            fi
            newer="$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -1)"
            if [ "$newer" != "$current" ]; then
              echo "$file is $current, upstream has $latest"
              title="New $file tag: $latest"
              existing="$(gh issue list --state open \
                --search "$title in:title" \
                --json number --jq '.[0].number')"
              if [ -z "$existing" ]; then
                gh issue create \
                  --title "$title" \
                  --body "Upstream has $latest, the image pins $current. Update $file and the matching commit file."
              fi
            fi
          }
          check https://gitlab.torproject.org/tpo/anti-censorship/pluggable-transports/lyrebird.git LYREBIRD_VERSION
          check https://gitlab.torproject.org/tpo/anti-censorship/pluggable-transports/webtunnel.git WEBTUNNEL_VERSION
