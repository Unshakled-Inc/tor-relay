name: weekly

on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: read VERSION
        id: version
        run: |
          version="$(cat VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  release:
    needs: version
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/build.yml
    with:
      tor_version: ${{ needs.version.outputs.version }}
      push: true
      no_cache: true
    secrets: inherit
