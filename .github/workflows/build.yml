name: build

on:
  workflow_call:
    inputs:
      tor_version:
        required: true
        type: string
      no_cache:
        required: false
        type: boolean
        default: false
      push:
        required: false
        type: boolean
        default: false
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tor_version:
        description: Tor version to build. Blank uses VERSION.
        required: false
        type: string
        default: ''
      no_cache:
        description: Disable the build cache.
        required: false
        type: boolean
        default: false
      push:
        description: Publish final tags and sign.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      series: ${{ steps.version.outputs.series }}
      datestamp: ${{ steps.version.outputs.datestamp }}
      tags: ${{ steps.version.outputs.tags }}
      lyrebird_version: ${{ steps.version.outputs.lyrebird_version }}
      webtunnel_version: ${{ steps.version.outputs.webtunnel_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: compute version and tags
        id: version
        run: |
          version="${{ inputs.tor_version }}"
          if [ -z "$version" ]; then
            version="$(cat VERSION)"
          fi
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "invalid tor version: $version" >&2
            exit 1
          fi
          series="$(printf '%s\n' "$version" | cut -d. -f1-3)"
          datestamp="$(date -u +%Y%m%d)"
          lyrebird_version="$(cat LYREBIRD_VERSION)"
          if ! printf '%s\n' "$lyrebird_version" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "invalid lyrebird version: $lyrebird_version" >&2
            exit 1
          fi
          webtunnel_version="$(cat WEBTUNNEL_VERSION)"
          if ! printf '%s\n' "$webtunnel_version" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "invalid webtunnel version: $webtunnel_version" >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "series=$series"
            echo "datestamp=$datestamp"
            echo "lyrebird_version=$lyrebird_version"
            echo "webtunnel_version=$webtunnel_version"
          } >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<EOF'
            printf '%s\n' "$version" "$series" "latest" "$version-$datestamp"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            artifact: amd64
            arch: amd64
            variant: ""
            qemu: false
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: arm64
            arch: arm64
            variant: ""
            qemu: false
          - platform: linux/arm/v7
            runner: ubuntu-24.04
            artifact: arm-v7
            arch: arm
            variant: v7
            qemu: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: set up qemu
        if: ${{ matrix.qemu }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build runtime for this platform
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          build-args: |
            TOR_VERSION=${{ needs.prepare.outputs.version }}
            TORINIT_VERSION=${{ needs.prepare.outputs.version }}
            REVISION=${{ github.sha }}
            LYREBIRD_VERSION=${{ needs.prepare.outputs.lyrebird_version }}
            WEBTUNNEL_VERSION=${{ needs.prepare.outputs.webtunnel_version }}
          tags: tor-relay:ci
          load: true
          no-cache: ${{ inputs.no_cache }}
      - name: version
        run: |
          docker run --rm tor-relay:ci version | tee version.txt
          if grep -q '^torinit dev$' version.txt; then
            echo "torinit version is dev, the build did not receive TORINIT_VERSION" >&2
            exit 1
          fi
          revision="$(docker image inspect tor-relay:ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          if [ -z "$revision" ] || [ "$revision" = "unknown" ]; then
            echo "missing org.opencontainers.image.revision label" >&2
            exit 1
          fi
      - name: check subcommands
        run: |
          docker run --rm tor-relay:ci envdoc > /dev/null
          docker run --rm --env-file examples/middle/.env.example tor-relay:ci render > /dev/null
          output="$(docker run --rm tor-relay:ci fingerprint 2>&1 || true)"
          if printf '%s' "$output" | grep -q "unknown subcommand"; then
            echo "fingerprint subcommand is missing" >&2
            exit 1
          fi
      - name: check env documentation
        if: ${{ matrix.artifact == 'amd64' }}
        run: |
          docker run --rm tor-relay:ci envdoc > envdoc.txt
          awk 'BEGIN{done=0} /<!-- envdoc:start -->/ && !done {flag=1;next} /<!-- envdoc:end -->/ {flag=0;done=1} flag' README.md > readme-envdoc.txt
          if ! diff -u readme-envdoc.txt envdoc.txt; then
            echo "README environment table does not match torinit envdoc" >&2
            exit 1
          fi
      - name: verify middle example
        run: docker run --rm --env-file examples/middle/.env.example tor-relay:ci verify
      - name: verify bridge example
        run: docker run --rm --env-file examples/bridge/.env.example tor-relay:ci verify
      - name: verify webtunnel example
        run: docker run --rm --env-file examples/webtunnel/.env.example tor-relay:ci verify
      - name: verify metrics
        run: docker run --rm --env-file examples/middle/.env.example -e "TOR_METRICS_PORT=0.0.0.0:9035" -e "TOR_METRICS_POLICY=accept 10.0.0.0/8" tor-relay:ci verify
      - name: build debug for this platform
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: debug
          platforms: ${{ matrix.platform }}
          build-args: |
            TOR_VERSION=${{ needs.prepare.outputs.version }}
            TORINIT_VERSION=${{ needs.prepare.outputs.version }}
            REVISION=${{ github.sha }}
            LYREBIRD_VERSION=${{ needs.prepare.outputs.lyrebird_version }}
            WEBTUNNEL_VERSION=${{ needs.prepare.outputs.webtunnel_version }}
          tags: tor-relay:ci-debug
          load: true
          no-cache: ${{ inputs.no_cache }}
      - name: debug version
        run: docker run --rm tor-relay:ci-debug version
      - name: verify debug control port
        run: docker run --rm --env-file examples/middle/.env.example -e TOR_CONTROL_PORT=9051 tor-relay:ci-debug verify
      - name: reject control port in runtime
        run: |
          if docker run --rm --env-file examples/middle/.env.example -e TOR_CONTROL_PORT=9051 tor-relay:ci verify; then
            echo "runtime image accepted TOR_CONTROL_PORT" >&2
            exit 1
          fi
      - name: check nyx
        run: docker run --rm --entrypoint /usr/bin/nyx tor-relay:ci-debug -v
      - name: build and push runtime by digest
        id: digest-runtime
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          build-args: |
            TOR_VERSION=${{ needs.prepare.outputs.version }}
            TORINIT_VERSION=${{ needs.prepare.outputs.version }}
            REVISION=${{ github.sha }}
            LYREBIRD_VERSION=${{ needs.prepare.outputs.lyrebird_version }}
            WEBTUNNEL_VERSION=${{ needs.prepare.outputs.webtunnel_version }}
          no-cache: ${{ inputs.no_cache }}
          outputs: |
            type=image,name=docker.io/unshakled/tor-relay,push-by-digest=true,name-canonical=true,push=true
            type=image,name=ghcr.io/unshakled-inc/tor-relay,push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
      - name: build and push debug by digest
        id: digest-debug
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: debug
          platforms: ${{ matrix.platform }}
          build-args: |
            TOR_VERSION=${{ needs.prepare.outputs.version }}
            TORINIT_VERSION=${{ needs.prepare.outputs.version }}
            REVISION=${{ github.sha }}
            LYREBIRD_VERSION=${{ needs.prepare.outputs.lyrebird_version }}
            WEBTUNNEL_VERSION=${{ needs.prepare.outputs.webtunnel_version }}
          no-cache: ${{ inputs.no_cache }}
          outputs: |
            type=image,name=docker.io/unshakled/tor-relay,push-by-digest=true,name-canonical=true,push=true
            type=image,name=ghcr.io/unshakled-inc/tor-relay,push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
      - name: extract runtime platform digest
        run: |
          index_digest="${{ steps.digest-runtime.outputs.digest }}"
          if [ -z "$index_digest" ]; then
            echo "build-push-action returned an empty runtime digest" >&2
            exit 1
          fi
          platform_digest="$(docker buildx imagetools inspect \
            "ghcr.io/unshakled-inc/tor-relay@$index_digest" \
            --format '{{json .Manifest.Manifests}}' \
            | jq -r --arg arch "${{ matrix.arch }}" --arg variant "${{ matrix.variant }}" \
                '.[] | select(.platform.os == "linux" and .platform.architecture == $arch and (.platform.variant // "") == $variant) | .digest' \
            | head -1)"
          if [ -z "$platform_digest" ] || [ "$platform_digest" = "null" ]; then
            echo "no runtime platform manifest for ${{ matrix.platform }} in $index_digest" >&2
            exit 1
          fi
          printf '%s\n' "$platform_digest" > "digest-${{ matrix.artifact }}.txt"
      - name: extract debug platform digest
        run: |
          index_digest="${{ steps.digest-debug.outputs.digest }}"
          if [ -z "$index_digest" ]; then
            echo "build-push-action returned an empty debug digest" >&2
            exit 1
          fi
          platform_digest="$(docker buildx imagetools inspect \
            "ghcr.io/unshakled-inc/tor-relay@$index_digest" \
            --format '{{json .Manifest.Manifests}}' \
            | jq -r --arg arch "${{ matrix.arch }}" --arg variant "${{ matrix.variant }}" \
                '.[] | select(.platform.os == "linux" and .platform.architecture == $arch and (.platform.variant // "") == $variant) | .digest' \
            | head -1)"
          if [ -z "$platform_digest" ] || [ "$platform_digest" = "null" ]; then
            echo "no debug platform manifest for ${{ matrix.platform }} in $index_digest" >&2
            exit 1
          fi
          printf '%s\n' "$platform_digest" > "digest-${{ matrix.artifact }}-debug.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.artifact }}
          path: digest-${{ matrix.artifact }}.txt
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.artifact }}-debug
          path: digest-${{ matrix.artifact }}-debug.txt
          retention-days: 1

  scan:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: assemble temporary manifest lists
        run: |
          runtime_sources=()
          debug_sources=()
          for file in digests/*.txt; do
            case "$file" in
              *-debug.txt)
                debug_sources+=("ghcr.io/unshakled-inc/tor-relay@$(cat "$file")")
                ;;
              *)
                runtime_sources+=("ghcr.io/unshakled-inc/tor-relay@$(cat "$file")")
                ;;
            esac
          done
          docker buildx imagetools create \
            -t "ghcr.io/unshakled-inc/tor-relay:scan-runtime-${GITHUB_RUN_ID}" \
            "${runtime_sources[@]}"
          docker buildx imagetools create \
            -t "ghcr.io/unshakled-inc/tor-relay:scan-debug-${GITHUB_RUN_ID}" \
            "${debug_sources[@]}"
      - name: scan runtime with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/unshakled-inc/tor-relay:scan-runtime-${{ github.run_id }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
          version: v0.70.0
      - name: scan debug with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/unshakled-inc/tor-relay:scan-debug-${{ github.run_id }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
          version: v0.70.0

  publish:
    if: ${{ inputs.push }}
    needs: [prepare, build, scan]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: create final tags
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          hub_runtime_sources=()
          ghcr_runtime_sources=()
          hub_debug_sources=()
          ghcr_debug_sources=()
          hub_runtime_tags=()
          ghcr_runtime_tags=()
          hub_debug_tags=("-t" "docker.io/unshakled/tor-relay:latest-debug")
          ghcr_debug_tags=("-t" "ghcr.io/unshakled-inc/tor-relay:latest-debug")
          for file in digests/*.txt; do
            digest="$(cat "$file")"
            case "$file" in
              *-debug.txt)
                hub_debug_sources+=("docker.io/unshakled/tor-relay@$digest")
                ghcr_debug_sources+=("ghcr.io/unshakled-inc/tor-relay@$digest")
                ;;
              *)
                hub_runtime_sources+=("docker.io/unshakled/tor-relay@$digest")
                ghcr_runtime_sources+=("ghcr.io/unshakled-inc/tor-relay@$digest")
                ;;
            esac
          done
          while IFS= read -r tag; do
            if [ -z "$tag" ]; then
              continue
            fi
            hub_runtime_tags+=("-t" "docker.io/unshakled/tor-relay:$tag")
            ghcr_runtime_tags+=("-t" "ghcr.io/unshakled-inc/tor-relay:$tag")
          done <<EOF
          $TAGS
          EOF
          docker buildx imagetools create "${hub_runtime_tags[@]}" "${hub_runtime_sources[@]}"
          docker buildx imagetools create "${ghcr_runtime_tags[@]}" "${ghcr_runtime_sources[@]}"
          docker buildx imagetools create "${hub_debug_tags[@]}" "${hub_debug_sources[@]}"
          docker buildx imagetools create "${ghcr_debug_tags[@]}" "${ghcr_debug_sources[@]}"
      - name: remove stale debug tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          jwt="$(curl -fsS -X POST https://hub.docker.com/v2/users/login/ \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"$DOCKERHUB_USERNAME\",\"password\":\"$DOCKERHUB_TOKEN\"}" \
            | jq -r .token)"
          if [ -z "$jwt" ] || [ "$jwt" = "null" ]; then
            echo "Docker Hub login failed" >&2
            exit 1
          fi
          page="https://hub.docker.com/v2/repositories/unshakled/tor-relay/tags/?page_size=100"
          while [ -n "$page" ] && [ "$page" != "null" ]; do
            response="$(curl -fsS -H "Authorization: JWT $jwt" "$page")"
            for tag in $(printf '%s' "$response" | jq -r '.results[].name'); do
              case "$tag" in
                *-debug)
                  if [ "$tag" != "latest-debug" ]; then
                    echo "removing stale debug tag $tag"
                    curl -fsS -X DELETE -H "Authorization: JWT $jwt" \
                      "https://hub.docker.com/v2/repositories/unshakled/tor-relay/tags/$tag/"
                  fi
                  ;;
              esac
            done
            page="$(printf '%s' "$response" | jq -r '.next // empty')"
          done
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: sign manifests
        run: |
          hub_digest="$(docker buildx imagetools inspect docker.io/unshakled/tor-relay:${{ needs.prepare.outputs.version }} --format '{{.Manifest.Digest}}')"
          ghcr_digest="$(docker buildx imagetools inspect ghcr.io/unshakled-inc/tor-relay:${{ needs.prepare.outputs.version }} --format '{{.Manifest.Digest}}')"
          hub_debug_digest="$(docker buildx imagetools inspect docker.io/unshakled/tor-relay:latest-debug --format '{{.Manifest.Digest}}')"
          ghcr_debug_digest="$(docker buildx imagetools inspect ghcr.io/unshakled-inc/tor-relay:latest-debug --format '{{.Manifest.Digest}}')"
          cosign sign --yes "docker.io/unshakled/tor-relay@$hub_digest"
          cosign sign --yes "ghcr.io/unshakled-inc/tor-relay@$ghcr_digest"
          cosign sign --yes "docker.io/unshakled/tor-relay@$hub_debug_digest"
          cosign sign --yes "ghcr.io/unshakled-inc/tor-relay@$ghcr_debug_digest"
      - name: verify signatures
        run: |
          for ref in \
            docker.io/unshakled/tor-relay:latest \
            docker.io/unshakled/tor-relay:latest-debug \
            ghcr.io/unshakled-inc/tor-relay:latest \
            ghcr.io/unshakled-inc/tor-relay:latest-debug; do
            cosign verify "$ref" \
              --certificate-identity-regexp 'https://github.com/Unshakled-Inc/tor-relay/.github/workflows/.*' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done

  readme:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: unshakled/tor-relay
          readme-filepath: ./README.md
