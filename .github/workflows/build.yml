name: build

on:
  workflow_call:
    inputs:
      tor_version:
        required: true
        type: string
      no_cache:
        required: false
        type: boolean
        default: false
      push:
        required: false
        type: boolean
        default: false
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tor_version:
        description: Tor version to build. Blank uses VERSION.
        required: false
        type: string
        default: ''
      no_cache:
        description: Disable the build cache.
        required: false
        type: boolean
        default: false
      push:
        description: Publish final tags and sign.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      series: ${{ steps.version.outputs.series }}
      datestamp: ${{ steps.version.outputs.datestamp }}
      tags: ${{ steps.version.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: compute version and tags
        id: version
        run: |
          version="${{ inputs.tor_version }}"
          if [ -z "$version" ]; then
            version="$(cat VERSION)"
          fi
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "invalid tor version: $version" >&2
            exit 1
          fi
          series="$(printf '%s\n' "$version" | cut -d. -f1-3)"
          datestamp="$(date -u +%Y%m%d)"
          {
            echo "version=$version"
            echo "series=$series"
            echo "datestamp=$datestamp"
          } >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<EOF'
            printf '%s\n' "$version" "$series" "latest" "$version-$datestamp"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            artifact: amd64
            arch: amd64
            variant: ""
            qemu: false
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: arm64
            arch: arm64
            variant: ""
            qemu: false
          - platform: linux/arm/v7
            runner: ubuntu-24.04
            artifact: arm-v7
            arch: arm
            variant: v7
            qemu: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: set up qemu
        if: ${{ matrix.qemu }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build runtime for this platform
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          build-args: TOR_VERSION=${{ needs.prepare.outputs.version }}
          tags: tor-relay:ci
          load: true
          no-cache: ${{ inputs.no_cache }}
      - name: version
        run: docker run --rm tor-relay:ci version
      - name: verify middle example
        run: docker run --rm --env-file examples/middle/.env.example tor-relay:ci verify
      - name: build and push by digest
        id: digest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          build-args: TOR_VERSION=${{ needs.prepare.outputs.version }}
          no-cache: ${{ inputs.no_cache }}
          outputs: |
            type=image,name=docker.io/unshakled/tor-relay,push-by-digest=true,name-canonical=true,push=true
            type=image,name=ghcr.io/unshakled-inc/tor-relay,push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
      - name: extract platform digest
        run: |
          index_digest="${{ steps.digest.outputs.digest }}"
          if [ -z "$index_digest" ]; then
            echo "build-push-action returned an empty digest" >&2
            exit 1
          fi
          platform_digest="$(docker buildx imagetools inspect \
            "ghcr.io/unshakled-inc/tor-relay@$index_digest" \
            --format '{{json .Manifest.Manifests}}' \
            | jq -r --arg arch "${{ matrix.arch }}" --arg variant "${{ matrix.variant }}" \
                '.[] | select(.platform.os == "linux" and .platform.architecture == $arch and (.platform.variant // "") == $variant) | .digest' \
            | head -1)"
          if [ -z "$platform_digest" ] || [ "$platform_digest" = "null" ]; then
            echo "no platform manifest for ${{ matrix.platform }} in $index_digest" >&2
            exit 1
          fi
          printf '%s\n' "$platform_digest" > "digest-${{ matrix.artifact }}.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.artifact }}
          path: digest-${{ matrix.artifact }}.txt
          retention-days: 1

  scan:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: assemble temporary manifest list
        run: |
          sources=()
          for file in digests/*.txt; do
            sources+=("ghcr.io/unshakled-inc/tor-relay@$(cat "$file")")
          done
          docker buildx imagetools create \
            -t "ghcr.io/unshakled-inc/tor-relay:scan-${GITHUB_RUN_ID}" \
            "${sources[@]}"
      - name: scan with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/unshakled-inc/tor-relay:scan-${{ github.run_id }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
          version: v0.70.0

  publish:
    if: ${{ inputs.push }}
    needs: [prepare, build, scan]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: create final tags
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          hub_sources=()
          ghcr_sources=()
          for file in digests/*.txt; do
            digest="$(cat "$file")"
            hub_sources+=("docker.io/unshakled/tor-relay@$digest")
            ghcr_sources+=("ghcr.io/unshakled-inc/tor-relay@$digest")
          done
          hub_args=()
          ghcr_args=()
          while IFS= read -r tag; do
            if [ -z "$tag" ]; then
              continue
            fi
            hub_args+=("-t" "docker.io/unshakled/tor-relay:$tag")
            ghcr_args+=("-t" "ghcr.io/unshakled-inc/tor-relay:$tag")
          done <<EOF
          $TAGS
          EOF
          docker buildx imagetools create "${hub_args[@]}" "${hub_sources[@]}"
          docker buildx imagetools create "${ghcr_args[@]}" "${ghcr_sources[@]}"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: sign manifests
        run: |
          hub_digest="$(docker buildx imagetools inspect docker.io/unshakled/tor-relay:${{ needs.prepare.outputs.version }} --format '{{.Manifest.Digest}}')"
          ghcr_digest="$(docker buildx imagetools inspect ghcr.io/unshakled-inc/tor-relay:${{ needs.prepare.outputs.version }} --format '{{.Manifest.Digest}}')"
          cosign sign --yes "docker.io/unshakled/tor-relay@$hub_digest"
          cosign sign --yes "ghcr.io/unshakled-inc/tor-relay@$ghcr_digest"

  readme:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: unshakled/tor-relay
          readme-filepath: ./README.md
